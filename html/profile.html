<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WeFo | Profile</title>
    <!-- Profile cần session gate và CSS riêng; dữ liệu account được điền bởi js/profile.js. -->
    <link rel="stylesheet" href="../css/profile.css?v=3">
    <link rel="stylesheet" href="../css/page-transitions.css?v=2">
    <script src="../js/page-transition.js" defer></script>
    <script src="../js/check_session.js"></script>
    <script src="../js/location_label.js"></script>
</head>

<body>
    <div class="weather-shell">
        <header class="site-header">
            <a class="brand" href="../index.html" aria-label="Weather WeFo home">
                <span class="brand-mark" aria-hidden="true"><span></span></span>
                <span>WeFo</span>
            </a>
            <nav class="main-nav" aria-label="Main navigation">
                <a href="../index.html">Today</a>
                <a href="forecast.html">Forecast</a>
                <a class="active" href="profile.html">Profile</a>
                <a href="map.html">Map</a>
            </nav>
            <a class="login-button" href="login.html">Login</a>
            <button class="location-button" type="button">
                <span aria-hidden="true">⌖</span>
                <span class="location-label">My Location</span>
            </button>
        </header>
        <main class="page">
            <div class="layout">
                <section id="profile">
                    <!-- Vùng hồ sơ duy nhất: các id phía dưới liên kết trực tiếp với renderer và editor trong profile.js. -->
                    <article class="profile-card">
                        <div class="profile-head">
                            <div>
                                <h2>Account details</h2><span class="status">WeFo member</span>
                            </div>
                        </div>
                        <!-- Các span value được thay bằng input/select ở chế độ Edit và phục hồi sau khi lưu. -->
                        <div class="details">
                            <div><span class="label">Full name</span><span id="profile-name" class="value">Loading...</span></div>
                            <div><span class="label">Email address</span><span id="profile-email" class="value">Loading...</span></div>
                            <div><span class="label">Password</span><span id="profile-password" class="value">Loading...</span></div>
                            <div><span class="label">Birthday</span><span id="profile-birthday" class="value">Loading...</span></div>
                            <div><span class="label">Gender</span><span id="profile-gender" class="value">Loading...</span></div>
                            <div class="profile-actions">
                                <button id="editProfileButton" class="edit-button" type="button">Edit profile</button>
                                <button id="logoutButton" class="logout-button" type="button">Log out</button>
                            </div>
                        </div>
                    </article>
                </section>
            </div>
        </main>
    </div>
    <!-- Firebase Auth/Firestore phải được khởi tạo trước profile.js để đọc và cập nhật hồ sơ theo UID. -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/10.13.1/firebase-app-compat.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/10.13.1/firebase-auth-compat.min.js"
            integrity="sha512-b2PGOE6ClpdFR5WZylPqJ9NEtHyGtdXKIe5wI0qRKVg3VeH9Km8CvihpnySwf6v21TV2cMTUp/BuglUiFLB38Q=="
            crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/10.13.1/firebase-firestore-compat.min.js"></script>        
    <script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/10.13.1/firebase-storage-compat.min.js"></script>
    <script src="../js/firebase_config.js"></script>
    <script src="../js/profile.js"></script>
</body>

</html>
