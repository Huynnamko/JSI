<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WeFo | Map</title>
    <!-- Tải kiểu dáng và thư viện Leaflet trước mã bản đồ để nền, nút phóng to và các dấu vị trí hoạt động. -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <link rel="stylesheet" href="../css/map.css?v=3">
    <link rel="stylesheet" href="../css/page-transitions.css?v=3">
    <script src="../js/page-transition.js?v=2" defer></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="../js/check_session.js"></script>
    <script src="../js/location_label.js"></script>
    <script src="../js/place_search.js?v=2"></script>
</head>

<body>
    <div class="weather-shell">
            <!-- Thanh đầu trang có các đường dẫn chính; mục Map được đánh dấu là trang đang mở. -->
        <header class="site-header">
            <a class="brand" href="../index.html" aria-label="Weather WeFo home"><span class="brand-mark"
                    aria-hidden="true"><span></span></span><span>WeFo</span></a>
            <nav class="main-nav" aria-label="Main navigation">
                <a href="../index.html">Today</a><a href="forecast.html">Forecast</a><a
                    href="profile.html">Profile</a><a class="active" href="map.html">Map</a>
            </nav>
            <a class="login-button" href="login.html">Login</a>
            <button class="location-button" type="button" id="location-button">
                <span aria-hidden="true">⌖</span>
                <span class="location-label">My Location</span>
            </button>
        </header>

        <main>
            <!-- Khu vực này ghép bản đồ thế giới với danh sách thành phố đã chọn trên trang Today. -->
            <section class="intro" aria-labelledby="map-title">
                <div>
                    <p class="eyebrow">Visual weather data</p>
                    <h1 id="map-title">Weather <em>map</em></h1>
                </div>
            </section>

            <!-- Bố cục đặt bản đồ cạnh danh sách; trên màn hình hẹp hai phần chuyển thành xếp dọc. -->
            <div class="map-layout">
                    <section class="map-card" aria-label="Global weather map">
                    <div class="map-toolbar">
                        <div class="map-title">Live weather map <span>· Worldwide</span></div>
                        <!-- Ô tìm dùng WeFoPlaceSearch; tọa độ nằm trong dữ liệu option, không đưa vào text hiển thị. -->
                        <div class="map-search-wrap">
                            <label class="map-search">
                                <span aria-hidden="true">⌕</span>
                                <input class="search" type="search" placeholder="Search city..." aria-label="Search city">
                            </label>
                            <div class="search-suggestions" id="search-suggestions" aria-live="polite"></div>
                        </div>
                    </div>
                        <!-- Leaflet vẽ bản đồ tại đây; dấu thành phố và dấu vị trí thiết bị được quản lý riêng. -->
                    <div id="map" aria-label="Global weather map"></div>
                </section>

                <aside class="side-stack" aria-label="Weather information">
                    <!-- Bấm một thành phố để đưa bản đồ tới nơi đó; danh sách vẫn theo các thẻ trên trang Today. -->
                    <section class="side-card">
                        <h2>Selected cities</h2>
                        <div class="city-list" id="selected-city-list"></div>
                    </section>
                </aside>
            </div>
        </main>
    </div>
    <!-- Tải Firebase và chức năng tìm địa điểm trước mã bản đồ; thư viện Leaflet ở đầu trang cũng phải sẵn sàng trước đó. -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/10.13.1/firebase-app-compat.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/10.13.1/firebase-auth-compat.min.js"
            integrity="sha512-b2PGOE6ClpdFR5WZylPqJ9NEtHyGtdXKIe5wI0qRKVg3VeH9Km8CvihpnySwf6v21TV2cMTUp/BuglUiFLB38Q=="
            crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/10.13.1/firebase-firestore-compat.min.js"></script>        
    <script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/10.13.1/firebase-storage-compat.min.js"></script>
    <script src="../js/firebase_config.js"></script>
    <script src="../js/map.js?v=7"></script>
</body>

</html>
